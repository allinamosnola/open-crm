<h2>Define tu contraseña</h2>
<p>Pediste un enlace para definir la contraseña con la que entras al panel de tu consultorio:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/aceptar-invitacion">
    Definir mi contraseña
  </a>
</p>
<p>Si no lo pediste, ignora este correo.</p>

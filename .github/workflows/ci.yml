name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Wechaty's puppet pulls in puppeteer; CI never runs the WhatsApp dev bot.
  PUPPETEER_SKIP_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build
        env:
          # Placeholder values: the build only needs them to be present.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy

  db:
    name: Database tests (pgTAP on local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase (migrations + seed)
        # Only Postgres is needed for pgTAP; skip the heavier services.
        run: >-
          npx supabase start
          -x studio,imgproxy,logflare,vector,edge-runtime,realtime,storage-api,mailpit,supavisor

      - name: Run pgTAP tests (supabase/tests/*.test.sql)
        run: npx supabase test db

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  e2e:
    name: E2E (Playwright on local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase (migrations + seed)
        run: >-
          npx supabase start
          -x studio,imgproxy,logflare,vector,edge-runtime,storage-api,mailpit,supavisor

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app (next build + next start)
      # and reads the local Supabase keys from `supabase status`. No Stripe,
      # Twilio REST, Anthropic or Resend credentials are provided.
      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports known vulnerabilities in production dependencies without blocking merges;
    # Dependabot opens the upgrade PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit production dependencies
        run: npm audit --omit=dev

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Mexico_City
    open-pull-requests-limit: 10
    groups:
      # Minor and patch bumps of dev tooling land in a single PR.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Mexico_City
    commit-message:
      prefix: ci
